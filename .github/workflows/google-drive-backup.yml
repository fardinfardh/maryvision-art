
name: Backup Maryvision Art to Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maryvision-art-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Configure Google Drive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Verify website source
        run: |
          test "$(git ls-files | wc -l)" -ge 3

      - name: Backup current website
        run: |
          rclone sync . \
            "personal-gdrive:Personal Websites - Automated Backups/maryvision-art/current/" \
            --exclude ".git/**" \
            --max-delete 10

      - name: Create complete Git history backup
        run: |
          git bundle create git-history.bundle --all
          git bundle verify git-history.bundle
          git rev-parse HEAD > commit.txt

      - name: Upload Git history and commit
        run: |
          rclone copyto git-history.bundle \
            "personal-gdrive:Personal Websites - Automated Backups/maryvision-art/git-history.bundle"
          rclone copyto commit.txt \
            "personal-gdrive:Personal Websites - Automated Backups/maryvision-art/commit.txt"
